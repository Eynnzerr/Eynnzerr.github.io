# Source commits run validation; deployment requires SITE_PUBLISH_ENABLED=true.
name: Personal site · GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/site-pages.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Deploy the verified artifact (also requires SITE_PUBLISH_ENABLED=true)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: personal-site-pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out public activity snapshots
        uses: actions/checkout@v7
        with:
          ref: site-activity
          path: activity-data
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Use the two locally aggregated snapshots
        run: |
          cp ../activity-data/github.json src/data/activity/github.json
          cp ../activity-data/codex.json src/data/activity/codex.json

      - name: Install site dependencies
        run: npm ci

      - name: Check types and existing logic tests
        run: |
          npm run check
          npm test

      - name: Build the static site
        env:
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
        run: npm run build

      - name: Verify release pages, references, search, feed and SEO files
        run: node scripts/verify-release.mjs

      - name: Upload the verified Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    if: vars.SITE_PUBLISH_ENABLED == 'true' && (github.event_name == 'push' || inputs.publish)
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
